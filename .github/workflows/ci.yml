name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: sitevisit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d sitevisit_test"
          --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/sitevisit_test
      DIRECT_URL: postgresql://app:app@localhost:5432/sitevisit_test
      DATABASE_URL_TEST: postgresql://app:app@localhost:5432/sitevisit_test
      AUTH_SECRET: ci-only-auth-secret
      LINK_SIGNING_SECRET: ci-only-link-secret
      PHONE_HASH_SECRET: ci-only-phone-secret
      CRON_SECRET: ci-only-cron-secret
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
